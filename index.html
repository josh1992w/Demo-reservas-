<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Noche de Gala Demo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    header p {
      font-size: 16px;
      opacity: 0.8;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .event-info {
      background: white;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 25px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .event-info h2 {
      margin-bottom: 10px;
    }

    .price {
      font-size: 22px;
      font-weight: bold;
      margin-top: 10px;
    }

    .stage {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .seat {
      border: none;
      border-radius: 10px;
      padding: 15px 5px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
      background: #39b54a;
      color: white;
    }

    .seat:hover {
      transform: scale(1.04);
    }

    .seat.selected {
      background: #f2b705;
      color: #111;
    }

    .seat.reserved {
      background: #d93636;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 25px 0;
      flex-wrap: wrap;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
    }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      display: inline-block;
    }

    .available {
      background: #39b54a;
    }

    .pending {
      background: #f2b705;
    }

    .confirmed {
      background: #d93636;
    }

    .reservation-box {
      background: white;
      margin-top: 30px;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .reservation-box h2 {
      margin-bottom: 15px;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    .reserve-button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .reserve-button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .selected-seat {
      margin-bottom: 15px;
      font-weight: bold;
      font-size: 18px;
    }

    @media (max-width: 600px) {

      .seats {
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
      }

      .seat {
        padding: 12px 2px;
        font-size: 12px;
      }

      header h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Noche de Gala Demo</h1>
    <p>Reserva tu asiento de manera rápida y sencilla</p>
  </header>

  <div class="container">

    <div class="event-info">
      <h2>Evento Demo 2026</h2>
      <p>📅 31 de octubre de 2026</p>
      <p>🕗 20:00</p>
      <div class="price">$25 por persona</div>
    </div>

    <div class="stage">
      ESCENARIO
    </div>

    <div class="legend">
      <span>
        <span class="dot available"></span>
        Disponible
      </span>

      <span>
        <span class="dot pending"></span>
        Seleccionado
      </span>

      <span>
        <span class="dot confirmed"></span>
        Reservado
      </span>
    </div>

    <div id="seats" class="seats"></div>

    <div class="reservation-box">

      <h2>Tu reserva</h2>

      <div id="selectedSeat" class="selected-seat">
        Selecciona un asiento
      </div>

      <input
        type="text"
        id="firstName"
        placeholder="Nombre"
      >

      <input
        type="text"
        id="lastName"
        placeholder="Apellido"
      >

      <input
        type="tel"
        id="phone"
        placeholder="Teléfono"
      >

      <button
        id="reserveButton"
        class="reserve-button"
        disabled
      >
        Reservar asiento
      </button>

    </div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://ewsopplkxoisbrhsojuu.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_PO2CY4KpTrf7CjamNbqutQ_VCS4wHox";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


const seatsContainer =
  document.getElementById("seats");

const selectedSeatText =
  document.getElementById("selectedSeat");

const reserveButton =
  document.getElementById("reserveButton");

let selectedSeat = null;


// CARGAR ASIENTOS

supabaseClient
  .from("seats")
  .select("seat_number, status")
  .order("seat_number")
  .then(({ data, error }) => {

    if (error) {
      console.error(
        "Error cargando asientos:",
        error.message
      );
      return;
    }

    data.forEach(seat => {

      const button =
        document.createElement("button");

      button.className = "seat";

      button.textContent =
        seat.seat_number;


      // PENDIENTE

      if (seat.status === "pending") {
        button.classList.add("pending");
      }


      // CONFIRMADO

      if (seat.status === "confirmed") {
        button.classList.add("reserved");
        button.disabled = true;
      }


      // SELECCIONAR

      button.onclick = function() {

        if (
          seat.status === "pending" ||
          seat.status === "confirmed"
        ) {
          return;
        }

        document
          .querySelectorAll(".seat")
          .forEach(seatButton => {
            seatButton.classList.remove("selected");
          });

        button.classList.add("selected");

        selectedSeat =
          seat.seat_number;

        selectedSeatText.textContent =
          "Asiento seleccionado: " +
          selectedSeat;

        reserveButton.disabled = false;
      };


      seatsContainer.appendChild(button);

    });

  });

</script>
  </div>


</body>
</html>
